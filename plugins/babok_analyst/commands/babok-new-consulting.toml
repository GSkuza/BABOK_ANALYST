description = "Start a new management-consulting engagement (profile consulting, Stage 0 — no IT delivery)"
prompt = "Start a new consulting engagement with the 'consulting' pipeline profile (stages 0–6; no software requirements or system design). Ask once for language PL or ENG if not given, map ENG→EN. Use babok_new_project with profile 'consulting' and the chosen language when MCP is available, otherwise run `babok new --profile consulting`. Then call babok_get_stage stage_n=0 and conduct the Engagement Charter: trigger & engagement type, sponsor & mandate, scope with explicit no-IT exclusion, fee structure & budget ceiling — one question at a time. Fetch the template with babok_get_stage_template (with project_id) before writing; keep H2 headings; then babok_save_deliverable and babok_submit_for_review."
