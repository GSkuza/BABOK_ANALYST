description = "Start a new software-development initiative (profile software-development, autonomous repository baseline — no self-approval)"
prompt = "Start a new software-development initiative with the 'software-development' pipeline profile (stages 0–6; modernisation/new-feature planning against an existing product and its connected repositories). Ask once for language PL or ENG if not given, map ENG→EN. Use babok_new_project with profile 'software-development' and the chosen language when MCP is available, otherwise run `babok new --profile software-development`. Then call babok_get_stage stage_n=0 and conduct the Change Charter: business trigger & desired outcome, product & repository scope (host/owner/ref per repository), ownership & authorisation boundaries, budget ceiling, target release window & exclusions — one question at a time. Fetch the template with babok_get_stage_template (with project_id) before writing; keep H2 headings; then babok_save_deliverable and babok_submit_for_review. After Stage 0 is approved, Stages 1 and 3 run autonomously from repository evidence — do not ask technology/architecture questions there, and never treat stage approval as authorisation to execute code, merge, or deploy."
